name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Unit tests and Android compatibility checks
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pushpush2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: pushpush2-debug-apk
          path: app/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android and launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.pushpush2
            adb shell am start -W -n com.pushpush2/.MainActivity
            sleep 3
            test -n "$(adb shell pidof com.pushpush2 | tr -d '\r')" || (echo "PushPush2 process died after launch"; adb logcat -d -t 400; exit 1)
            mkdir -p app/build/reports/smoke
            adb exec-out screencap -p > app/build/reports/smoke/api-${{ matrix.api-level }}.png
            adb shell pidof com.pushpush2

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pushpush2-smoke-api-${{ matrix.api-level }}
          path: app/build/reports/smoke/api-${{ matrix.api-level }}.png
          if-no-files-found: warn
